name: riocut

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  movies:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args:
        APP_NAME: movies
        NEXT_PUBLIC_APP_NAME: Riocut
        NEXT_PUBLIC_APP_URL: ${RIOCUT_URL:-https://riocut.com}
        NEXT_PUBLIC_TMDB_API_KEY: ${TMDB_API_KEY}
        NEXT_PUBLIC_BLOG_SITE_URL: ${NEXT_PUBLIC_BLOG_SITE_URL:-}
        NEXT_PUBLIC_RIOCUT_URL: ${RIOCUT_URL:-https://riocut.com}
        NEXT_PUBLIC_RIOCUT_SPORTS_URL: ${RIOCUT_SPORTS_URL:-https://sports.riocut.com}
        NEXT_PUBLIC_RIOCUT_TV_URL: ${RIOCUT_TV_URL:-https://tv.riocut.com}
        NEXT_PUBLIC_TURN_SERVER: ${NEXT_PUBLIC_TURN_SERVER:-}
        NEXT_PUBLIC_TURN_USERNAME: ${NEXT_PUBLIC_TURN_USERNAME:-}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
    image: ${RIOCUT_IMAGE_NAME:-riocut-movies:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RIOCUT_PORT:-8000}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_URL: ${RIOCUT_AUTH_URL:-${RIOCUT_URL:-https://riocut.com}}
      NEXTAUTH_URL: ${RIOCUT_AUTH_URL:-${RIOCUT_URL:-https://riocut.com}}
      TMDB_API_KEY: ${TMDB_API_KEY}
      NEXT_PUBLIC_TMDB_API_KEY: ${TMDB_API_KEY}
      NEXT_PUBLIC_APP_NAME: Riocut
      NEXT_PUBLIC_APP_URL: ${RIOCUT_URL}
      NEXT_PUBLIC_RIOCUT_URL: ${RIOCUT_URL}
      NEXT_PUBLIC_RIOCUT_SPORTS_URL: ${RIOCUT_SPORTS_URL}
      NEXT_PUBLIC_BLOG_SITE_URL: ${NEXT_PUBLIC_BLOG_SITE_URL:-}
      NEXT_PUBLIC_TURN_SERVER: ${NEXT_PUBLIC_TURN_SERVER:-}
      NEXT_PUBLIC_TURN_USERNAME: ${NEXT_PUBLIC_TURN_USERNAME:-}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}

  sports:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args:
        APP_NAME: sports
        NEXT_PUBLIC_APP_NAME: RioSports
        NEXT_PUBLIC_APP_URL: ${RIOCUT_SPORTS_URL:-https://sports.riocut.com}
        NEXT_PUBLIC_BLOG_SITE_URL: ${NEXT_PUBLIC_BLOG_SITE_URL:-}
        NEXT_PUBLIC_RIOCUT_URL: ${RIOCUT_URL:-https://riocut.com}
        NEXT_PUBLIC_RIOCUT_SPORTS_URL: ${RIOCUT_SPORTS_URL:-https://sports.riocut.com}
        NEXT_PUBLIC_RIOCUT_TV_URL: ${RIOCUT_TV_URL:-https://tv.riocut.com}
        NEXT_PUBLIC_TURN_SERVER: ${NEXT_PUBLIC_TURN_SERVER:-}
        NEXT_PUBLIC_TURN_USERNAME: ${NEXT_PUBLIC_TURN_USERNAME:-}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
    image: ${RIOCUT_SPORTS_IMAGE_NAME:-riocut-sports:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RIOCUT_SPORTS_PORT:-5555}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_URL: ${RIOCUT_SPORTS_AUTH_URL:-${RIOCUT_SPORTS_URL:-https://sports.riocut.com}}
      NEXTAUTH_URL: ${RIOCUT_SPORTS_AUTH_URL:-${RIOCUT_SPORTS_URL:-https://sports.riocut.com}}
      NEXT_PUBLIC_APP_NAME: RioSports
      NEXT_PUBLIC_APP_URL: ${RIOCUT_SPORTS_URL}
      NEXT_PUBLIC_RIOCUT_URL: ${RIOCUT_URL}
      NEXT_PUBLIC_RIOCUT_SPORTS_URL: ${RIOCUT_SPORTS_URL}
      NEXT_PUBLIC_BLOG_SITE_URL: ${NEXT_PUBLIC_BLOG_SITE_URL:-}
      NEXT_PUBLIC_TURN_SERVER: ${NEXT_PUBLIC_TURN_SERVER:-}
      NEXT_PUBLIC_TURN_USERNAME: ${NEXT_PUBLIC_TURN_USERNAME:-}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
      BSD_API_TOKEN: ${BSD_API_TOKEN:-}

  tv:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args:
        APP_NAME: tv
        NEXT_PUBLIC_APP_NAME: Riocut TV
        NEXT_PUBLIC_APP_URL: ${RIOCUT_TV_URL:-https://tv.riocut.com}
        NEXT_PUBLIC_BLOG_SITE_URL: ${NEXT_PUBLIC_BLOG_SITE_URL:-}
        NEXT_PUBLIC_RIOCUT_URL: ${RIOCUT_URL:-https://riocut.com}
        NEXT_PUBLIC_RIOCUT_SPORTS_URL: ${RIOCUT_SPORTS_URL:-https://sports.riocut.com}
        NEXT_PUBLIC_RIOCUT_TV_URL: ${RIOCUT_TV_URL:-https://tv.riocut.com}
        NEXT_PUBLIC_TURN_SERVER: ${NEXT_PUBLIC_TURN_SERVER:-}
        NEXT_PUBLIC_TURN_USERNAME: ${NEXT_PUBLIC_TURN_USERNAME:-}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
    image: ${RIOCUT_TV_IMAGE_NAME:-riocut-tv:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RIOCUT_TV_PORT:-3333}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_URL: ${RIOCUT_TV_AUTH_URL:-${RIOCUT_TV_URL:-https://tv.riocut.com}}
      NEXTAUTH_URL: ${RIOCUT_TV_AUTH_URL:-${RIOCUT_TV_URL:-https://tv.riocut.com}}
      NEXT_PUBLIC_APP_NAME: Riocut TV
      NEXT_PUBLIC_APP_URL: ${RIOCUT_TV_URL}
      NEXT_PUBLIC_RIOCUT_URL: ${RIOCUT_URL}
      NEXT_PUBLIC_RIOCUT_SPORTS_URL: ${RIOCUT_SPORTS_URL}
      NEXT_PUBLIC_RIOCUT_TV_URL: ${RIOCUT_TV_URL}
      NEXT_PUBLIC_BLOG_SITE_URL: ${NEXT_PUBLIC_BLOG_SITE_URL:-}
      NEXT_PUBLIC_TURN_SERVER: ${NEXT_PUBLIC_TURN_SERVER:-}
      NEXT_PUBLIC_TURN_USERNAME: ${NEXT_PUBLIC_TURN_USERNAME:-}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}

  blog:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args:
        APP_NAME: blog
        NEXT_PUBLIC_APP_NAME: "Riocut Blog"
        NEXT_PUBLIC_APP_URL: ${RIOCUT_BLOG_URL:-https://blog.riocut.com}
        NEXT_PUBLIC_RIOCUT_URL: ${RIOCUT_URL:-https://riocut.com}
        NEXT_PUBLIC_RIOCUT_SPORTS_URL: ${RIOCUT_SPORTS_URL:-https://sports.riocut.com}
        NEXT_PUBLIC_RIOCUT_TV_URL: ${RIOCUT_TV_URL:-https://tv.riocut.com}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
    image: ${RIOCUT_BLOG_IMAGE_NAME:-riocut-blog:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RIOCUT_BLOG_PORT:-4444}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_URL: ${RIOCUT_BLOG_AUTH_URL:-${RIOCUT_BLOG_URL:-https://blog.riocut.com}}
      NEXTAUTH_URL: ${RIOCUT_BLOG_AUTH_URL:-${RIOCUT_BLOG_URL:-https://blog.riocut.com}}
      NEXT_PUBLIC_APP_NAME: Riocut Blog
      NEXT_PUBLIC_APP_URL: ${RIOCUT_BLOG_URL}
      NEXT_PUBLIC_RIOCUT_URL: ${RIOCUT_URL}
      NEXT_PUBLIC_RIOCUT_SPORTS_URL: ${RIOCUT_SPORTS_URL}
      NEXT_PUBLIC_RIOCUT_TV_URL: ${RIOCUT_TV_URL}
      NEXT_PUBLIC_RIOCUT_BLOG_URL: ${RIOCUT_BLOG_URL}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}

  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args:
        APP_NAME: admin
        NEXT_PUBLIC_APP_NAME: "Riocut Admin"
        NEXT_PUBLIC_APP_URL: ${RIOCUT_ADMIN_URL:-https://admin.riocut.com}
        NEXT_PUBLIC_TMDB_API_KEY: ${TMDB_API_KEY}
        NEXT_PUBLIC_RIOCUT_URL: ${RIOCUT_URL:-https://riocut.com}
        NEXT_PUBLIC_RIOCUT_SPORTS_URL: ${RIOCUT_SPORTS_URL:-https://sports.riocut.com}
        NEXT_PUBLIC_RIOCUT_TV_URL: ${RIOCUT_TV_URL:-https://tv.riocut.com}
        NEXT_PUBLIC_RIOCUT_BLOG_URL: ${RIOCUT_BLOG_URL:-https://blog.riocut.com}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
    image: ${RIOCUT_ADMIN_IMAGE_NAME:-riocut-admin:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RIOCUT_ADMIN_PORT:-5566}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_URL: ${RIOCUT_ADMIN_AUTH_URL:-${RIOCUT_ADMIN_URL:-https://admin.riocut.com}}
      NEXTAUTH_URL: ${RIOCUT_ADMIN_AUTH_URL:-${RIOCUT_ADMIN_URL:-https://admin.riocut.com}}
      TMDB_API_KEY: ${TMDB_API_KEY}
      NEXT_PUBLIC_TMDB_API_KEY: ${TMDB_API_KEY}
      NEXT_PUBLIC_APP_NAME: Riocut Admin
      NEXT_PUBLIC_APP_URL: ${RIOCUT_ADMIN_URL}
      NEXT_PUBLIC_RIOCUT_URL: ${RIOCUT_URL}
      NEXT_PUBLIC_RIOCUT_SPORTS_URL: ${RIOCUT_SPORTS_URL}
      NEXT_PUBLIC_RIOCUT_TV_URL: ${RIOCUT_TV_URL}
      NEXT_PUBLIC_RIOCUT_BLOG_URL: ${RIOCUT_BLOG_URL}
      NEXT_PUBLIC_RIOCUT_ADMIN_URL: ${RIOCUT_ADMIN_URL}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}

volumes:
  postgres_data:
    # Pinned to the pre-rebrand name: this volume holds the live database.
    name: egfilm_postgres_data
